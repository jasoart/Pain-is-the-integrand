<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122e47">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Pain is the Integrand 的 116 學年度數學大考倒數。切換學測數 A 與分科數甲，查看距離開考還有幾天、幾小時、幾分和幾秒。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:title" content="116 數學大考倒數｜Pain is the Integrand">
  <meta property="og:description" content="學測數 A、分科數甲即時倒數與考程，依臺灣時間顯示。">
  <meta property="og:image" content="https://jasoart.github.io/Pain-is-the-integrand/assets/brand.png">
  <title>116 數學大考倒數｜Pain is the Integrand</title>
  <link rel="icon" type="image/png" href="assets/brand.png">
  <link rel="stylesheet" href="assets/styles.css?v=26cb585457">
  <script type="module" src="assets/app.mjs?v=af8d627a9d"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至倒數計時</a>
  <header class="masthead">
    <div class="masthead-inner page-width">
      <a class="wordmark" href="./" lang="en">
        <img src="assets/brand.png" alt="" width="48" height="48">
        <span>Pain is the <i>Integrand</i></span>
      </a>
      <a class="source-link" href="https://www.ceec.edu.tw/files/file_pool/1/0q215601929252011195/116學年度簡章.pdf" target="_blank" rel="noopener noreferrer">
        大考中心簡章 <span aria-hidden="true">↗</span>
      </a>
    </div>
  </header>

  <main id="main" class="page-width">
    <div class="page-heading">
      <div>
        <p class="academic-year">116 學年度</p>
        <h1>數學大考倒數</h1>
      </div>
      <div class="exam-switch" role="group" aria-label="選擇倒數考科" hidden>
        <button type="button" id="btn-gsat" aria-pressed="true" aria-controls="countdown">學測數 A</button>
        <button type="button" id="btn-ast" aria-pressed="false" aria-controls="countdown">分科數甲</button>
      </div>
    </div>

    <section id="countdown" class="countdown-sheet" aria-labelledby="count-caption">
      <div class="board">
        <div class="readout">
          <h2 id="count-caption" aria-live="polite">距離 學測數學 A 開考</h2>
          <div class="timer" role="timer" aria-labelledby="count-caption" aria-live="off">
            <div class="day-line"><span id="days">—</span><span class="day-unit">天</span></div>
            <div class="clock">
              <div><span id="hours">—</span><small>小時</small></div>
              <span class="colon" aria-hidden="true">:</span>
              <div><span id="minutes">—</span><small>分鐘</small></div>
              <span class="colon" aria-hidden="true">:</span>
              <div><span id="seconds">—</span><small>秒</small></div>
            </div>
          </div>
        </div>
        <img class="integral-plot" src="assets/integral.webp" width="900" height="570" alt="">
      </div>

      <div class="exam-details">
        <dl>
          <div class="exam-day">
            <dt>考試日期</dt>
            <dd><time id="exam-date" datetime="2027-01-22">2027.01.22</time> <span id="weekday" class="weekday">星期五</span></dd>
          </div>
          <div>
            <dt>考試時段</dt>
            <dd id="exam-hours">09:20–11:00</dd>
          </div>
          <div>
            <dt>作答時間</dt>
            <dd><span id="duration">100</span> <span class="detail-unit">分鐘</span></dd>
          </div>
        </dl>
        <button class="calendar-button" id="save-calendar" type="button" hidden>
          <span class="calendar-icon" aria-hidden="true"></span> 加入行事曆
        </button>
      </div>
    </section>

    <noscript>
      <div class="no-script">
        <p>啟用 JavaScript 即可查看即時倒數。兩科開考時間如下。</p>
        <ul>
          <li>學測數學 A　<time datetime="2027-01-22T09:20:00+08:00">2027 年 1 月 22 日 09:20</time></li>
          <li>分科數學甲　<time datetime="2027-07-10T14:00:00+08:00">2027 年 7 月 10 日 14:00</time></li>
        </ul>
      </div>
    </noscript>
    <div class="time-notes">
      <span><i class="clock-icon" aria-hidden="true"></i> 臺灣時間 <bdi>UTC+8</bdi></span>
      <span>每滿 24 小時計為 1 天</span>
    </div>
  </main>
  <div class="toast" id="status" role="status" aria-live="polite"></div>
</body>
</html>
